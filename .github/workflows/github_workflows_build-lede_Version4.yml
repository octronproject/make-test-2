name: Build LEDE Xiaomi Mi Router 3G SPI-NOR

on:
  workflow_dispatch:
  push:
    paths:
      - "custom/.config"
      - "custom/mt7621_xiaomi_mi-router-3g.dts"
      - ".github/workflows/github_workflows_build-lede_Version4.yml"

permissions:
  contents: read

concurrency:
  group: lede-${{ github.ref }}
  cancel-in-progress: true

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede.git
  LEDE_REF: master
  LEDE_DIR: lede
  DTS_NAME: mt7621_xiaomi_mi-router-3g.dts

jobs:
  build:
    name: Build LEDE SPI-NOR 16 MB
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        continue-on-error: true
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libgnutls28-dev libelf-dev \
            m4 pkg-config python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl ccache

      - name: Clone pinned LEDE source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags --branch "${LEDE_REF}" \
            "${LEDE_REPO}" "${LEDE_DIR}"
          cd "${LEDE_DIR}"
          git rev-parse --short=12 HEAD

      - name: Validate custom files
        run: |
          set -euo pipefail
          test -f custom/.config
          test -f "custom/${DTS_NAME}"
          grep -q '#include "mt7621.dtsi"' "custom/${DTS_NAME}"
          grep -q 'jedec,spi-nor' "custom/${DTS_NAME}"
          grep -q '&spi0' "custom/${DTS_NAME}"
          grep -q '&gsw' "custom/${DTS_NAME}"

          if grep -q 'mt7621_xiaomi_nand_128m.dtsi' "custom/${DTS_NAME}"; then
            echo "ERROR: DTS masih menggunakan basis NAND." >&2
            exit 1
          fi

          if grep -q '&switch0' "custom/${DTS_NAME}"; then
            echo "ERROR: Gunakan &gsw untuk fork LEDE ini, bukan &switch0." >&2
            exit 1
          fi

      - name: Apply custom DTS
        run: |
          set -euo pipefail
          cp "custom/${DTS_NAME}" \
            "${LEDE_DIR}/target/linux/ramips/dts/${DTS_NAME}"

      - name: Replace Xiaomi Mi Router 3G profile
        working-directory: lede
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("target/linux/ramips/image/mt7621.mk")
          text = path.read_text()
          profile = """define Device/xiaomi_mi-router-3g
            $(Device/dsa-migration)
            $(Device/uimage-lzma-loader)
            DEVICE_MODEL := Mi Router 3G
            DEVICE_DTS := mt7621_xiaomi_mi-router-3g
            IMAGE_SIZE := 16064k
            DEVICE_PACKAGES += kmod-mt7603 kmod-mt76x2 kmod-usb3 \\
              kmod-usb-ledtrig-usbport
            SUPPORTED_DEVICES += R3G mir3g xiaomi,mir3g
          endef
          TARGET_DEVICES += xiaomi_mi-router-3g"""

          pattern = re.compile(
              r"define Device/xiaomi_mi-router-3g\n.*?"
              r"^TARGET_DEVICES \+= xiaomi_mi-router-3g$",
              re.MULTILINE | re.DOTALL,
          )
          matches = list(pattern.finditer(text))

          if len(matches) > 1:
              raise SystemExit("Ditemukan lebih dari satu profil.")
          if len(matches) == 1:
              text = text[:matches[0].start()] + profile + text[matches[0].end():]
          else:
              text = text.rstrip() + (
                  "\n\n# Custom Xiaomi Mi Router 3G SPI-NOR 16M\n"
                  + profile + "\n"
              )

          path.write_text(text)
          PY

          count="$(grep -c '^TARGET_DEVICES += xiaomi_mi-router-3g$' \
            target/linux/ramips/image/mt7621.mk || true)"
          test "$count" = "1"

      - name: Apply custom config
        run: cp custom/.config lede/.config

      - name: Update feeds
        working-directory: lede
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        working-directory: lede
        run: |
          set -e
          make defconfig
          grep -q '^CONFIG_TARGET_ramips=y' .config
          grep -q '^CONFIG_TARGET_ramips_mt7621=y' .config

      - name: Verify and repair host tools
        working-directory: lede
        run: |
          set -euo pipefail

          # Rebuild host tools in a coherent stage instead of requesting an
          # individual tool/install target that is absent in older Makefiles.
          make -j"$(nproc)" tools/install V=s

          test -x staging_dir/host/bin/m4
          test -x staging_dir/host/bin/flex
          staging_dir/host/bin/m4 --version >/dev/null
          staging_dir/host/bin/flex --version >/dev/null

      - name: Compile target kernel
        working-directory: lede
        run: make -j"$(nproc)" target/linux/compile V=s

      - name: Build firmware
        working-directory: lede
        run: make -j"$(nproc)" V=s

      - name: Check output
        working-directory: lede
        run: |
          set -e
          echo "=== Output files ==="
          find bin/targets/ramips/mt7621 -maxdepth 1 -type f -printf '%f\n' | sort
          echo "=== Output sizes ==="
          du -h bin/targets/ramips/mt7621/*

          test -n "$(find bin/targets/ramips/mt7621 -maxdepth 1 -type f \
            \( -name '*squashfs*sysupgrade*' -o -name '*squashfs*factory*' \) -print -quit)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: lede-xiaomi-mi-router-3g-spi16m
          path: |
            lede/bin/targets/ramips/mt7621/*sysupgrade*.bin
            lede/bin/targets/ramips/mt7621/*factory*.bin
            lede/bin/targets/ramips/mt7621/config.buildinfo
            lede/bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: error
          retention-days: 14
