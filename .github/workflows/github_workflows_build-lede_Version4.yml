name: Build LEDE Xiaomi Mi Router 3G SPI-NOR

on:
  workflow_dispatch:
  push:
    paths:
      - "custom/.config"
      - "custom/mt7621_xiaomi_mi-router-3g.dts"
      - ".github/workflows/build-lede.yml"

permissions:
  contents: read

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede.git
  LEDE_BRANCH: master
  LEDE_DIR: lede
  DTS_NAME: mt7621_xiaomi_mi-router-3g.dts

jobs:
  build:
    name: Build LEDE SPI-NOR 16 MB
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository custom
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache

      - name: Clone LEDE
        run: |
          git clone \
            --depth=1 \
            --branch "${LEDE_BRANCH}" \
            "${LEDE_REPO}" \
            "${LEDE_DIR}"

      - name: Validate custom files
        run: |
          test -f custom/.config
          test -f "custom/${DTS_NAME}"

          grep -q '#include "mt7621.dtsi"' \
            "custom/${DTS_NAME}"

          grep -q 'jedec,spi-nor' \
            "custom/${DTS_NAME}"

          grep -q '&spi0' \
            "custom/${DTS_NAME}"

          if grep -q 'mt7621_xiaomi_nand_128m.dtsi' \
            "custom/${DTS_NAME}"; then
            echo "ERROR: DTS masih menggunakan basis NAND."
            exit 1
          fi

          if grep -q '&switch0' \
            "custom/${DTS_NAME}"; then
            echo "ERROR: Gunakan &gsw untuk fork LEDE ini, bukan &switch0."
            exit 1
          fi

          grep -q '&gsw' \
            "custom/${DTS_NAME}"

      - name: Apply custom DTS
        run: |
          cp \
            "custom/${DTS_NAME}" \
            "${LEDE_DIR}/target/linux/ramips/dts/${DTS_NAME}"

      - name: Replace Xiaomi Mi Router 3G profile
        working-directory: lede
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("target/linux/ramips/image/mt7621.mk")
          text = path.read_text()

          profile = """define Device/xiaomi_mi-router-3g
            $(Device/dsa-migration)
            $(Device/uimage-lzma-loader)
            DEVICE_MODEL := Mi Router 3G
            DEVICE_DTS := mt7621_xiaomi_mi-router-3g
            IMAGE_SIZE := 16064k
            DEVICE_PACKAGES += kmod-mt7603 kmod-mt76x2 kmod-usb3 \\
              kmod-usb-ledtrig-usbport
            SUPPORTED_DEVICES += R3G mir3g xiaomi,mir3g
          endef
          TARGET_DEVICES += xiaomi_mi-router-3g"""

          pattern = re.compile(
              r"define Device/xiaomi_mi-router-3g\n"
              r".*?"
              r"^TARGET_DEVICES \+= xiaomi_mi-router-3g$",
              re.MULTILINE | re.DOTALL,
          )

          matches = list(pattern.finditer(text))

          if len(matches) > 1:
              raise SystemExit(
                  "Ditemukan lebih dari satu profil xiaomi_mi-router-3g."
              )

          if len(matches) == 1:
              text = (
                  text[:matches[0].start()]
                  + profile
                  + text[matches[0].end():]
              )
          else:
              text = text.rstrip() + (
                  "\n\n# Custom Xiaomi Mi Router 3G SPI-NOR 16M\n"
                  + profile
                  + "\n"
              )

          path.write_text(text)
          PY

          count="$(
            grep -c \
              '^TARGET_DEVICES += xiaomi_mi-router-3g$' \
              target/linux/ramips/image/mt7621.mk || true
          )"

          if [ "$count" != "1" ]; then
            echo "ERROR: Profil Xiaomi Mi Router 3G tidak tepat satu."
            exit 1
          fi

          grep -n -A12 -B2 \
            'Device/xiaomi_mi-router-3g' \
            target/linux/ramips/image/mt7621.mk

      - name: Apply custom config
        run: |
          cp custom/.config lede/.config

      - name: Update feeds
        working-directory: lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        working-directory: lede
        run: |
          make defconfig

          echo "=== Target configuration ==="
          grep -E \
            'CONFIG_TARGET_ramips|CONFIG_TARGET_DEVICE_ramips_mt7621|CONFIG_TARGET_ROOTFS' \
            .config || true

      - name: Compile Linux target
        working-directory: lede
        run: |
          make target/linux/compile V=s

      - name: Build firmware
        working-directory: lede
        run: |
          make -j"$(nproc)" V=s

      - name: Check output
        working-directory: lede
        run: |
          echo "=== Output files ==="
          find bin/targets/ramips/mt7621 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo "=== Output sizes ==="
          du -h bin/targets/ramips/mt7621/*

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: lede-xiaomi-mi-router-3g-spi16m
          path: |
            lede/bin/targets/ramips/mt7621/*
          if-no-files-found: error
          retention-days: 14