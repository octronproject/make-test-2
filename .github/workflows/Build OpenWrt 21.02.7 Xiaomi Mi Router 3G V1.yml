name: Build OpenWrt 21.02.7 Xiaomi Mi Router 3G V1

on:
  workflow_dispatch:

env:
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Your Repository
      uses: actions/checkout@v4

    - name: Set Timezone to WIB
      run: |
        sudo timedatectl set-timezone "Asia/Jakarta"
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    - name: Free Disk Space & Install Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo docker rmi $(docker image ls -q) 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y purge azure-cli google-cloud-cli google-chrome-stable firefox powershell dotnet-sdk*
        sudo -E apt-get update
        sudo -E apt-get -y install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget \
        libffi-dev pkg-config
        sudo -E apt-get autoremove --purge -y
        sudo -E apt-get clean

    - name: Clone OpenWrt Source & Checkout Tag
      run: |
        git clone https://github.com/openwrt/openwrt.git
        cd openwrt
        git pull
        git checkout v21.02.7

    - name: Update and Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply custom files (Overwrite Config, DTS, MK)
      run: |
        set -e
        cp xiaomi-mi_r3g_v1/.config openwrt/.config
        cp xiaomi-mi_r3g_v1/mt7621.mk openwrt/target/linux/ramips/image/mt7621.mk
        cp xiaomi-mi_r3g_v1/mt7621_xiaomi_mi-router-3g.dts openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts
        
        cd openwrt
        make defconfig

    - name: Patch Python3 Build Configuration
      run: |
        cd openwrt
        # Disable _hashlib module yang menyebabkan conflict
        cat >> feeds/packages/lang/python/python3/files/python3.mk << 'EOF'
        
        # Disable problematic _hashlib module
        CONFIG_PYTHON3_HASHLIB=n
        CONFIG_PYTHON3_CTYPES=n
        EOF
        
        # Alternative: Patch Modules/Setup untuk OpenSSL linking
        if [ -d "build_dir/target-*/Python-*" ]; then
          PYTHON_DIR=$(find build_dir/target-* -maxdepth 1 -type d -name "Python-*" | head -1)
          if [ -d "$PYTHON_DIR" ]; then
            cat > "$PYTHON_DIR/Modules/Setup.local" << 'SETUP_EOF'
        SSL=/usr/lib/x86_64-linux-gnu
        _socket socketmodule.c
        _ssl _ssl.c \
              -DUSE_SSL -I/usr/include/openssl \
              -L$(SSL) -lssl -lcrypto
        SETUP_EOF
          fi
        fi

    - name: Download Package Source (Pre-download)
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size 0 -exec rm -f {} \;

    - name: Compile Toolchain & Firmware
      env:
        LDFLAGS: "-Wl,--as-needed"
        CFLAGS_NODIST: "-fPIC"
      run: |
        cd openwrt
        # First attempt with full parallelization
        make -j$(nproc) world || {
          echo "First build attempt failed. Retrying with verbose output..."
          # Retry with single job and verbose output for debugging
          make -j1 V=s world
        }

    - name: Check Build Output
      if: always()
      run: |
        cd openwrt
        ls -lh bin/targets/ 2>/dev/null || echo "No build output found"
        if [ -d "build_dir" ]; then
          echo "Build directory exists"
          du -sh build_dir/ 2>/dev/null || true
        fi

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_21.02.7_xiaomi-mi_r3g_v1_${{ env.BUILD_DATE }}
        path: openwrt/bin
        retention-days: 30

    - name: Upload Build Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs_${{ env.BUILD_DATE }}
        path: openwrt/logs/
        retention-days: 7
