name: Build x-wrt v26.10 MIR3G

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    
    # Prevent parallel builds
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4
      
    - name: Set Build Date & Timezone
      run: |
        sudo timedatectl set-timezone "Asia/Jakarta"
        echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Clean & Install prerequisites
      run: |
        sudo docker rmi $(docker image ls -q) 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y purge azure-cli google-cloud-cli google-chrome-stable firefox powershell dotnet-sdk*
        sudo -E apt-get update
        sudo -E apt-get -y install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget ccache
        sudo -E apt-get autoremove --purge -y
        sudo -E apt-get clean

    - name: Clone x-wrt v26.10
      run: |
        git clone https://github.com/x-wrt/x-wrt.git
        cd x-wrt
        git pull
        git checkout 26.10_b202610132026

    - name: Update feeds
      run: |
        cd x-wrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply custom files (Overwrite Config, DTS, MK)
      run: |
        set -e
        cp custom/build-xwrt/.config x-wrt/.config
                
        cd x-wrt
        make defconfig
        
    - name: Download Package Source (Pre-download)
      run: |
        cd x-wrt
        make download -j$(nproc)
        find dl -size 0 -exec rm -f {} \;

    - name: Compile Toolchain & Firmware (World)
      run: |
        cd openwrt
        make -j$(nproc) world || make -j1 V=s world

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: x-wrt_26.10_MIR3G_${{ env.BUILD_DATE }}
        path: x-wrt/bin
