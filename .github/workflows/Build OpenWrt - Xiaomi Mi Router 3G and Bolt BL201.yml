name: Build OpenWrt - Xiaomi Mi Router 3G & Bolt BL201

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/Build OpenWrt v25.12.6 (Xiaomi Mi Router 3G).yml'
      - 'xiaomi-mir3g/**'
      - 'bolt-bl201/**'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.device }} / OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - device: xiaomi-mir3g
            version: v25.12.6
          - device: bolt-bl201
            version: v21.02.7

    steps:
      - name: Checkout custom files
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget

      - name: Clone selected OpenWrt version
        env:
          OPENWRT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          git clone --branch "$OPENWRT_VERSION" --depth 1 \
            https://github.com/openwrt/openwrt.git openwrt
          test "$(git -C openwrt describe --tags --exact-match)" = "$OPENWRT_VERSION"

      - name: Apply Xiaomi Mi Router 3G custom files
        if: matrix.device == 'xiaomi-mir3g'
        run: |
          set -euo pipefail
          test -s xiaomi-mir3g/.config
          test -s xiaomi-mir3g/mt7621_xiaomi_mi-router-3g.dts
          test -s xiaomi-mir3g/mt7621.mk

          cp xiaomi-mir3g/.config openwrt/.config
          cp xiaomi-mir3g/mt7621_xiaomi_mi-router-3g.dts \
            openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts

          # Merge only the custom device definition; do not replace the full
          # upstream mt7621.mk, which contains profiles for many other devices.
          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path("xiaomi-mir3g/mt7621.mk").read_text()
          destination = Path("openwrt/target/linux/ramips/image/mt7621.mk")
          text = destination.read_text()
          device = "xiaomi_mi-router-3g"
          pattern = re.compile(
              rf"^define Device/{re.escape(device)}\n.*?"
              rf"^endef\nTARGET_DEVICES \+= {re.escape(device)}$",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(source)
          if not match:
              raise SystemExit(f"Custom profile {device} not found in mt7621.mk")
          custom_profile = match.group(0)
          if pattern.search(text):
              text = pattern.sub(lambda _: custom_profile, text, count=1)
          else:
              text = text.rstrip() + "\n\n" + custom_profile + "\n"
          destination.write_text(text)
          PY

      - name: Apply Bolt BL201 custom files (OpenWrt 21.02)
        if: matrix.device == 'bolt-bl201'
        run: |
          set -euo pipefail
          test -s bolt-bl201/.config
          test -s bolt-bl201/BOLT-BL201.dts
          test -s bolt-bl201/mt7620.mk
          test -s bolt-bl201/01_leds
          test -s bolt-bl201/02_network

          cp bolt-bl201/.config openwrt/.config
          cp bolt-bl201/BOLT-BL201.dts \
            openwrt/target/linux/ramips/dts/BOLT-BL201.dts

          # Merge the one Bolt profile into the existing image file, preserving
          # all upstream device profiles and image definitions.
          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path("bolt-bl201/mt7620.mk").read_text()
          destination = Path("openwrt/target/linux/ramips/image/mt7620.mk")
          text = destination.read_text()
          device = "bolt-bl201"
          pattern = re.compile(
              rf"^define Device/{re.escape(device)}\n.*?"
              rf"^endef\nTARGET_DEVICES \+= {re.escape(device)}$",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(source)
          if not match:
              raise SystemExit(f"Custom profile {device} not found in mt7620.mk")
          custom_profile = match.group(0)
          if pattern.search(text):
              text = pattern.sub(lambda _: custom_profile, text, count=1)
          else:
              text = text.rstrip() + "\n\n" + custom_profile + "\n"
          destination.write_text(text)

          # Keep the upstream board scripts intact and add only BL201-specific
          # board setup. In 21.02 these scripts live in ramips/base-files.
          board_dir = Path("openwrt/target/linux/ramips/mt7620/base-files/etc/board.d")
          for filename, case_line in (
              ("01_leds", '\tbolt-bl201)\n\t\tucidef_set_led_default "power" "POWER" "bolt-bl201:blue:power" "1"\n\t\t;;\n'),
              ("02_network", '\tbolt-bl201)\n\t\tucidef_add_switch "switch0" \\\n\t\t\t"0:lan" "1:lan" "2:lan" "3:lan" "4:wan" "6@eth0"\n\t\t;;\n'),
          ):
              path = board_dir / filename
              board_text = path.read_text()
              if "bolt-bl201)" not in board_text:
                  if not re.search(r"\nesac\s*$", board_text):
                      raise SystemExit(f"Cannot find final esac in {path}")
                  board_text = re.sub(r"\nesac\s*$", "\n" + case_line + "esac\n", board_text)
                  path.write_text(board_text)
          PY

      - name: Update feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a

      - name: Install feeds
        working-directory: openwrt
        run: ./scripts/feeds install -a

      - name: Resolve OpenWrt configuration
        working-directory: openwrt
        run: |
          set -euo pipefail
          # defconfig can normalize the working copy openwrt/.config. The checked-out
          # custom config under xiaomi-mir3g/ or bolt-bl201/ is never modified.
          make defconfig
          grep -q '^CONFIG_TARGET_ramips=y' .config
          if [ "${{ matrix.device }}" = "xiaomi-mir3g" ]; then
            grep -q '^CONFIG_TARGET_ramips_mt7621=y' .config
          else
            grep -q '^CONFIG_TARGET_ramips_mt7620=y' .config
          fi

      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)" V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.version }}-${{ matrix.device }}
          path: openwrt/bin/targets/**
          if-no-files-found: error
          retention-days: 14
