name: Build OpenWrt v25.12.6 - Xiaomi Mi Router 3G

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-openwrt-v25.12.6.yml'
      - 'xiaomi-mir3g/**'

permissions:
  contents: read

concurrency:
  group: openwrt-v25.12.6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      OPENWRT_TAG: v25.12.6

    steps:
      - name: Checkout custom configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt source
        run: |
          set -euo pipefail
          git clone --branch "$OPENWRT_TAG" --depth 1 \
            https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt describe --tags --exact-match

      - name: Validate and apply custom files
        run: |
          set -euo pipefail
          test -s xiaomi-mir3g/.config
          test -s xiaomi-mir3g/mt7621_xiaomi_mi-router-3g.dts
          test -s xiaomi-mir3g/mt7621.mk

          cp xiaomi-mir3g/.config openwrt/.config
          cp xiaomi-mir3g/mt7621_xiaomi_mi-router-3g.dts \
            openwrt/target/linux/ramips/dts/mt7621_xiaomi_mi-router-3g.dts
          cp xiaomi-mir3g/mt7621.mk \
            openwrt/target/linux/ramips/image/mt7621.mk

      - name: Update feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a

      - name: Install feeds
        working-directory: openwrt
        run: ./scripts/feeds install -a

      - name: Resolve config without losing the supplied .config
        working-directory: openwrt
        run: |
          set -euo pipefail
          cp .config "$RUNNER_TEMP/custom-openwrt.config"
          make defconfig
          # defconfig may normalize or add options. Restore the user's exact file
          # so the build starts with the supplied .config, not the normalized one.
          cp "$RUNNER_TEMP/custom-openwrt.config" .config
          cmp -s .config "$RUNNER_TEMP/custom-openwrt.config"
          echo 'Custom .config restored unchanged after make defconfig.'

      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)" V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_TAG }}-xiaomi-mir3g
          path: openwrt/bin/targets/**
          if-no-files-found: error
          retention-days: 14
